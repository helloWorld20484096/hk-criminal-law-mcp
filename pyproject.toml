[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-criminal-law-mcp"
version = "0.3.0"
description = "Local-first MCP server for Hong Kong criminal law and defence research"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "HK Criminal Law MCP contributors" }]
keywords = ["hong-kong", "criminal-law", "legal-research", "mcp", "claude"]
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
semantic = [
  "sentence-transformers>=3.0",
  "torch>=2.0",
  "umap-learn>=0.5",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "pyarrow>=15",
  "numpy>=1.26",
]

[project.scripts]
hk-law = "hk_criminal_law_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
